appId: com.corazonnuevo.inventario
productName: Sistema de Inventario
directories:
  output: release
  buildResources: build
win:
  target: nsis
  icon: src/assets/logo.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: src/assets/logo.png
  createDesktopShortcut: true
  createStartMenuShortcut: true
files:
  - dist/**/*
  - electron/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: ../inventario-backend
    to: backend
    filter:
      - "**/*"
